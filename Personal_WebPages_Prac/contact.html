<!DOCTYPE>
<html>
    <head>
        <link rel="stylesheet" href="food_delivery.css">
    <title>Online Food Delivery System</title>
    </head>
    <body>
        <div id="ContactUs">
            <h1>Contact Us</h1>
            <form id="contactForm">
                 <div class="form-shape">
                <label for="query">Query:</label>
               <select name="myquery" id="query">
                <option value="Sel" Selected> Select</option>
                <option value="ord">Order Releated Queries</option>
                <option value="site">Site related Issues</option>
                <option value="fed">Complaint related Issues</option>
                <option value="others">Others</option>
            </select>
            </div>
             <div class="form-shape">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter Your Name" required>
             </div>
              <div class="form-shape">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
                </div>
                <div class="form-shape">
                <label for="pho">Phone Number</label>
                <input type="phone" name="myPhone" id="pho" placeholder="Enter your Phone no">
                </div>
                <div id="radio">
                Are you a member of OnlneFoodShop:
                Yes <input type="radio" name="eligible">
                No <input type="radio" name="eligible">
            </div>
            <div class="form-shape">
                <label for="message">
                    Ellaborate your query
                </label>
                <textarea name="mesg" id="message" cols="30" rows="10">
				</textarea>
            </div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
            </form>
                 

        </div>
    </body>
</html>
